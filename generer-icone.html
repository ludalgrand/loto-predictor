<!DOCTYPE html>
<html>
<body>
<canvas id="c192" width="192" height="192"></canvas>
<canvas id="c512" width="512" height="512"></canvas>
<script>
function dessiner(id, taille) {
  const c = document.getElementById(id);
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#2c3e50';
  ctx.fillRect(0, 0, taille, taille);
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.arc(taille*0.5, taille*0.52, taille*0.35, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#f39c12';
  ctx.beginPath();
  ctx.arc(taille*0.75, taille*0.25, taille*0.14, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = 'white';
  ctx.font = `bold ${taille*0.28}px Arial`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('LP', taille*0.5, taille*0.54);
  ctx.font = `bold ${taille*0.14}px Arial`;
  ctx.fillText('★', taille*0.75, taille*0.25);
  const lien = document.createElement('a');
  lien.download = id + '.png';
  lien.href = c.toDataURL('image/png');
  lien.click();
}
dessiner('c192', 192);
setTimeout(() => dessiner('c512', 512), 500);
</script>
</body>
</html>
